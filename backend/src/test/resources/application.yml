# Test profile. The datasource is supplied at runtime by Testcontainers
# (see PostgresTestBase); everything else that has no default in
# application.yml is given a throwaway value here so the context can start.

spring:
  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    issuer: ev-rental-api
    secret: test-signing-key-used-only-by-the-test-suite
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  # Throwaway AES-256 key for the test suite (32 bytes, base64). The tests
  # never assert on its value — only that ciphertext round-trips, differs from
  # the plaintext, and differs between two encryptions of the same number.
  aadhaar-encryption-key: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=

logging:
  level:
    com.evrental: DEBUG
    org.testcontainers: WARN
