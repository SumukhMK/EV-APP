# Defaults for every environment. Anything that differs per environment is an
# environment variable with no default, so a missing one fails at boot rather
# than silently falling back to a development value in production.

spring:
  application:
    name: ev-rental-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # One tenant's SET LOCAL must never leak into the next request on a
      # recycled connection. SET LOCAL is transaction-scoped so it cannot, but
      # a modest pool keeps that easy to reason about under load.
      #
      # Overridable because a serverless Postgres (Neon) caps connections far
      # below what a dedicated instance allows, and a pool that asks for more
      # than the ceiling fails at the worst moment rather than at boot. Point
      # DB_URL at the *pooled* endpoint there and keep this small.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate checks the mapping against it and
      # refuses to start on a mismatch — it never changes a column.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The baseline is V001; there is no pre-Flyway state to adopt.
    baseline-on-migrate: false

  threads:
    virtual:
      # Off for now. The pool in AsyncConfig is sized deliberately and virtual
      # threads would change how blocking JDBC calls behave under it; that is a
      # decision to make with load numbers, not by default.
      enabled: false

server:
  port: ${PORT:8080}
  error:
    # Never return a stack trace or the internal path. GlobalExceptionHandler
    # writes the only error body a caller sees.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Health only. Every other actuator endpoint leaks something.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    issuer: ev-rental-api
    # No default: a signing key committed to a repository is a signing key
    # everyone has. Supplied per environment; see docs/backend/README.md.
    secret: ${JWT_SECRET}
    'access-token-ttl': 15m
    'refresh-token-ttl': 7d
  bootstrap:
    # The first admin, created at boot when these are set (BootstrapData).
    # Empty means "skip" — an environment that already has admins leaves them
    # unset. The local profile fills them in for development.
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:}
    # When set, also seeds the demo tenant and its users (local development).
    'demo-password': ${DEMO_PASSWORD:}

logging:
  level:
    com.evrental: INFO
