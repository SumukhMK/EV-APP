# Local development against `docker compose up` in this folder.
#
# Every value here is a development value and none of it is a secret worth
# protecting — the database listens on localhost, and the signing key below
# signs tokens that are only ever accepted by a container on this machine.
# Deployed environments supply all of it through the environment and never load
# this profile.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/evrental
    username: evrental
    password: evrental

  jpa:
    # Off by default — turn it on for one debugging session, not for a workday.
    show-sql: false

server:
  error:
    # The opposite of production, on purpose: locally the message is the point.
    include-stacktrace: on_param
    include-message: always

management:
  endpoint:
    health:
      show-details: always

app:
  cors:
    # The Vite dev server.
    allowed-origins: http://localhost:5173
  jwt:
    secret: local-development-signing-key-not-a-secret-32b+
  bootstrap:
    # The platform super admin, created at boot if missing. Password matches
    # the frontend Login screen's default field value, so wiring the real login
    # later needs no typing.
    admin-email: priya@g1mobility.in
    admin-name: Priya Menon
    admin-password: demo-build
    # Seeds the G1 Mobility tenant and its three demo users (Meenakshi,
    # Abhinandan, Dhananjay) with this password — the personas the frontend's
    # persona switch uses, so every role can actually be logged into.
    demo-password: demo-build
    # Loads the 137-bike demo fleet from db/seed/fleet.csv, generated from the
    # frontend fixtures (`npm run seed:export`). Local only: a real deployment
    # leaves this false and imports its own fleet.
    seed-fleet: true

logging:
  level:
    'com.evrental': DEBUG
    'org.flywaydb': INFO
